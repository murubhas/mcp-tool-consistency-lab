[project]
name = "tool-lab-strands-client"
version = "0.1.0"
description = "Optional AWS Strands Agents client for the Tool Lab MCP server."
readme = "README.md"
authors = [
    { name = "Murubhas" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.27.0",
    "openai>=2.0.0",
    "strands-agents>=1.38.0",
]

[project.scripts]
tool-lab-strands = "tool_lab_strands_client.main:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
