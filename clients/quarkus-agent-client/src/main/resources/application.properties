quarkus.application.name=tool-lab-quarkus-agent-client

# Quarkus LangChain4j MCP client. The lab MCP server currently runs on 8088.
quarkus.langchain4j.mcp.tool-lab.transport-type=streamable-http
quarkus.langchain4j.mcp.tool-lab.url=${TOOL_LAB_MCP_URL:http://localhost:8088/mcp}
quarkus.langchain4j.mcp.tool-lab.tool-execution-timeout=120s
# Enable these only for live smoke visibility. Logs may include prompts, tool payloads, and responses.
# quarkus.langchain4j.mcp.tool-lab.log-requests=true
# quarkus.langchain4j.mcp.tool-lab.log-responses=true
# quarkus.langchain4j.mcp.tool-lab.subsidiary-channel=false

# Default chat model: Qwen/vLLM through the OpenAI-compatible adapter.
# The AI service is bound to the named model "tool-lab" so the provider can be switched by profile.
quarkus.langchain4j.tool-lab.chat-model.provider=openai
quarkus.langchain4j.openai.tool-lab.base-url=${QWEN_OPENAI_BASE_URL:http://localhost:8000/v1}
quarkus.langchain4j.openai.tool-lab.api-key=${QWEN_OPENAI_API_KEY:dummy}
quarkus.langchain4j.openai.tool-lab.timeout=120s
quarkus.langchain4j.openai.tool-lab.chat-model.model-name=${QWEN_MODEL:qwen36-27b-all1000-plus-toollab-no-tool-fp8}
quarkus.langchain4j.openai.tool-lab.chat-model.temperature=0
quarkus.langchain4j.openai.tool-lab.chat-model.max-completion-tokens=1024
quarkus.langchain4j.openai.embedding-model.enabled=false
quarkus.langchain4j.openai.moderation-model.enabled=false
quarkus.langchain4j.openai.image-model.enabled=false

# Optional Bedrock Claude Sonnet profile. Credentials come from the AWS default credential chain.
quarkus.langchain4j.bedrock.enable-integration=false
quarkus.langchain4j.bedrock.embedding-model.enabled=false
quarkus.langchain4j.bedrock.tool-lab.chat-model.model-id=${BEDROCK_GROUNDING_MODEL_ID:us.anthropic.claude-sonnet-4-6}
quarkus.langchain4j.bedrock.tool-lab.aws.region=${AWS_REGION:us-east-2}
quarkus.langchain4j.bedrock.tool-lab.chat-model.temperature=0
quarkus.langchain4j.bedrock.tool-lab.chat-model.max-tokens=1024

%bedrock.quarkus.langchain4j.tool-lab.chat-model.provider=bedrock
