quarkus.application.name=tool-lab-evaluator
quarkus.banner.enabled=false
quarkus.devservices.enabled=false

# Most evaluator properties below are commented examples. Benchmark runs should pass
# live/provider identity through CLI flags or runtime environment so manifests capture
# the intended run identity and accidental live calls are avoided.
#
# Milestone 2 live-client slice. CLI flags take precedence for benchmark metadata and model IDs.
# Prompt variant for tool-calling instruction prompt templates. CLI --prompt-variant takes precedence.
# tool.lab.prompt.variant=baseline
#
# Tool execution mode. The packaged evaluator uses mcp-http for benchmark evidence over the native Quarkus MCP Server.
# tool.lab.tool-execution=mcp-http
# tool.lab.mcp.endpoint=http://localhost:8081/mcp
%dev.tool.lab.mcp.endpoint=http://localhost:8088/mcp
#
# Qwen/OpenAI-compatible via Quarkus REST Client Jackson:
# quarkus.rest-client.qwen-openai.url=http://localhost:8000/v1/chat/completions
# tool.lab.qwen.model-id=Qwen/Qwen3.6-27B
# tool.lab.qwen.model-revision=local-vllm
# tool.lab.qwen.served-model-name=Qwen/Qwen3.6-27B
# tool.lab.qwen.api-key=
# Optional vLLM chat template option. Leave unset to preserve provider defaults.
# tool.lab.qwen.enable-thinking=false
# tool.lab.qwen.preserve-thinking=false
#
# Claude Sonnet via Quarkiverse Amazon Bedrock Runtime / AWS SDK v2:
# Do not use --region or --endpoint for Sonnet live runs; configure these Quarkus properties instead.
quarkus.bedrockruntime.sync-client.type=apache
# tool.lab.sonnet.model-id=anthropic.claude-3-5-sonnet-20241022-v2:0
# tool.lab.sonnet.model-revision=bedrock
# quarkus.bedrockruntime.aws.region=us-east-1
# quarkus.bedrockruntime.endpoint-override=https://bedrock-runtime.us-east-1.amazonaws.com
# quarkus.bedrockruntime.api-call-timeout=PT5M
# quarkus.bedrockruntime.api-call-attempt-timeout=PT2M
